# Example nginx site for the Hetzner VPS. Cloudflare sits in front (proxied DNS),
# so use a Cloudflare Origin Certificate here and set SSL mode to "Full (strict)".
server {
    listen 443 ssl http2;
    server_name automatedcodingsystems.com www.automatedcodingsystems.com;

    ssl_certificate     /etc/ssl/cloudflare/automatedcodingsystems.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/automatedcodingsystems.com.key;

    root /var/www/automatedcodingsystems/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name automatedcodingsystems.com www.automatedcodingsystems.com;
    return 301 https://$host$request_uri;
}
